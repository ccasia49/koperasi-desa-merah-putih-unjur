<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Produk - KDMP Unjur</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #b40000;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 5px 0 0;
            opacity: .9;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            border: 0;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 5px;
        }

        .tambah {
            background: #b40000;
            color: white;
        }

        .hapus {
            background: #333;
            color: white;
        }

        .produk {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .produk h3 {
            margin-top: 0;
        }

        .harga {
            font-weight: bold;
            color: #b40000;
        }

        .stok {
            margin: 8px 0;
        }

        label {
            font-weight: bold;
        }

        .kosong {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Admin Produk</h1>
    <p>Koperasi Desa Merah Putih Unjur</p>
</header>

<div class="container">

    <div class="card">

        <h2>Tambah Produk</h2>

        <form id="formProduk">

            <label>Nama Produk</label>
            <input
                type="text"
                id="nama"
                placeholder="Contoh: Beras Unjur"
                required
            >

            <label>Kategori</label>
            <input
                type="text"
                id="kategori"
                placeholder="Contoh: Sembako"
            >

            <label>Harga</label>
            <input
                type="number"
                id="harga"
                placeholder="Contoh: 15000"
            >

            <label>Stok</label>
            <input
                type="number"
                id="stok"
                placeholder="Contoh: 20"
            >

            <label>Deskripsi</label>
            <textarea
                id="deskripsi"
                placeholder="Deskripsi produk"
            ></textarea>

            <button class="tambah" type="submit">
                + Tambah Produk
            </button>

        </form>

    </div>


    <div class="card">

        <h2>Daftar Produk</h2>

        <div id="daftarProduk">
            Memuat produk...
        </div>

    </div>

</div>


<script>

const API = "http://localhost:3000";


async function tampilkanProduk() {

    const container = document.getElementById("daftarProduk");

    try {

        const response = await fetch(API + "/api/produk");

        const produk = await response.json();

        if (produk.length === 0) {

            container.innerHTML =
                '<div class="kosong">Belum ada produk.</div>';

            return;
        }

        container.innerHTML = "";

        produk.forEach(p => {

            const div = document.createElement("div");

            div.className = "produk";

            div.innerHTML = `
                <h3>${p.nama}</h3>

                <div>
                    Kategori: ${p.kategori || "-"}
                </div>

                <div class="harga">
                    Rp ${Number(p.harga).toLocaleString("id-ID")}
                </div>

                <div class="stok">
                    Stok: ${p.stok}
                </div>

                <div>
                    ${p.deskripsi || ""}
                </div>

                <br>

                <button
                    class="hapus"
                    onclick="hapusProduk(${p.id})">
                    Hapus
                </button>
            `;

            container.appendChild(div);

        });

    } catch (error) {

        container.innerHTML =
            "<b>Gagal terhubung ke server.</b>";

    }
}


document
    .getElementById("formProduk")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const data = {

            nama: document.getElementById("nama").value,

            kategori:
                document.getElementById("kategori").value,

            harga:
                document.getElementById("harga").value,

            stok:
                document.getElementById("stok").value,

            deskripsi:
                document.getElementById("deskripsi").value

        };


        const response = await fetch(
            API + "/api/produk",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        if (response.ok) {

            alert("Produk berhasil ditambahkan!");

            document.getElementById("formProduk").reset();

            tampilkanProduk();

        } else {

            alert("Gagal menambahkan produk.");

        }

    });


async function hapusProduk(id) {

    if (!confirm("Hapus produk ini?")) {
        return;
    }

    const response = await fetch(
        API + "/api/produk/" + id,
        {
            method: "DELETE"
        }
    );


    if (response.ok) {

        tampilkanProduk();

    } else {

        alert("Gagal menghapus produk.");

    }

}


tampilkanProduk();

</script>

</body>
</html>
