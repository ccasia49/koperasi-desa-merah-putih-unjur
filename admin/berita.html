<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita Admin - KDMP Unjur</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #b40000, #e00000);
            color: white;
            padding: 20px;
        }

        header h1 {
            font-size: 23px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            opacity: .9;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            text-decoration: none;
            color: #b40000;
            font-weight: bold;
        }

        .form-box,
        .list-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 19px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-simpan {
            background: #b40000;
            color: white;
        }

        .btn-batal {
            background: #777;
            color: white;
            margin-left: 5px;
        }

        .berita {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .berita h3 {
            margin-bottom: 8px;
            color: #b40000;
        }

        .tanggal {
            color: #777;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .isi {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .gambar {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .btn-edit {
            background: #eee;
            color: #222;
        }

        .btn-hapus {
            background: #b40000;
            color: white;
            margin-left: 5px;
        }

        .kosong {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 14px;
            }

            .form-box,
            .list-box {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Berita Admin</h1>
    <p>Koperasi Desa Merah Putih Unjur</p>
</header>

<div class="container">

    <a href="index.html" class="back">← Kembali ke Dashboard</a>

    <div class="form-box">

        <h2 id="judulForm">Tambah Berita</h2>

        <form id="formBerita">

            <label>Judul Berita</label>
            <input
                type="text"
                id="judul"
                placeholder="Masukkan judul berita"
                required
            >

            <label>Isi Berita</label>
            <textarea
                id="isi"
                placeholder="Tulis isi berita..."
                required
            ></textarea>

            <label>Link Gambar</label>
            <input
                type="text"
                id="gambar"
                placeholder="Contoh: images/berita1.jpg"
            >

            <button type="submit" class="btn-simpan">
                Simpan Berita
            </button>

            <button
                type="button"
                class="btn-batal"
                id="btnBatal"
                style="display:none;"
                onclick="batalEdit()"
            >
                Batal
            </button>

        </form>

    </div>

    <div class="list-box">

        <h2>Daftar Berita</h2>

        <div id="daftarBerita">
            <div class="kosong">Memuat berita...</div>
        </div>

    </div>

</div>

<script>

const API = "http://localhost:3000/api";

let editId = null;


// ==============================
// FORMAT TANGGAL
// ==============================

function formatTanggal(tanggal) {

    return new Date(tanggal).toLocaleDateString(
        "id-ID",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

}


// ==============================
// LOAD BERITA
// ==============================

async function loadBerita() {

    try {

        const response = await fetch(API + "/berita");
        const berita = await response.json();

        const container = document.getElementById("daftarBerita");

        if (berita.length === 0) {

            container.innerHTML =
                '<div class="kosong">Belum ada berita.</div>';

            return;
        }

        container.innerHTML = "";

        berita
            .slice()
            .reverse()
            .forEach(b => {

                const div = document.createElement("div");

                div.className = "berita";

                div.innerHTML = `

                    <h3>${escapeHtml(b.judul)}</h3>

                    <div class="tanggal">
                        ${formatTanggal(b.tanggal)}
                    </div>

                    ${
                        b.gambar
                        ?
                        `<img
                            src="${escapeAttribute(b.gambar)}"
                            class="gambar"
                            onerror="this.style.display='none'"
                        >`
                        :
                        ""
                    }

                    <div class="isi">
                        ${escapeHtml(b.isi)}
                    </div>

                    <button
                        class="btn-edit"
                        onclick="editBerita(${b.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="btn-hapus"
                        onclick="hapusBerita(${b.id})"
                    >
                        Hapus
                    </button>
                `;

                container.appendChild(div);

            });

    } catch (error) {

        console.error(error);

        document.getElementById("daftarBerita").innerHTML =
            '<div class="kosong">Gagal terhubung ke server.</div>';

    }

}


// ==============================
// TAMBAH / EDIT
// ==============================

document.getElementById("formBerita")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {

        judul:
            document.getElementById("judul").value,

        isi:
            document.getElementById("isi").value,

        gambar:
            document.getElementById("gambar").value

    };


    try {

        let response;

        if (editId) {

            response = await fetch(
                API + "/berita/" + editId,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }
            );

        } else {

            response = await fetch(
                API + "/berita",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }
            );

        }


        if (!response.ok) {

            alert("Gagal menyimpan berita.");
            return;

        }


        alert(
            editId
            ? "Berita berhasil diperbarui."
            : "Berita berhasil ditambahkan."
        );


        batalEdit();

        loadBerita();


    } catch (error) {

        console.error(error);

        alert("Tidak dapat terhubung ke server.");

    }

});


// ==============================
// EDIT BERITA
// ==============================

async function editBerita(id) {

    try {

        const response =
            await fetch(API + "/berita");

        const berita =
            await response.json();

        const data =
            berita.find(b => b.id === id);

        if (!data) {

            alert("Berita tidak ditemukan.");
            return;

        }

        editId = id;

        document.getElementById("judul").value =
            data.judul;

        document.getElementById("isi").value =
            data.isi;

        document.getElementById("gambar").value =
            data.gambar || "";

        document.getElementById("judulForm").textContent =
            "Edit Berita";

        document.getElementById("btnBatal").style.display =
            "inline-block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {

        alert("Gagal mengambil data berita.");

    }

}


// ==============================
// BATAL EDIT
// ==============================

function batalEdit() {

    editId = null;

    document.getElementById("formBerita").reset();

    document.getElementById("judulForm").textContent =
        "Tambah Berita";

    document.getElementById("btnBatal").style.display =
        "none";

}


// ==============================
// HAPUS BERITA
// ==============================

async function hapusBerita(id) {

    const yakin =
        confirm("Yakin ingin menghapus berita ini?");

    if (!yakin) return;


    try {

        const response =
            await fetch(
                API + "/berita/" + id,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            alert("Gagal menghapus berita.");
            return;

        }


        loadBerita();

    } catch (error) {

        alert("Tidak dapat terhubung ke server.");

    }

}


// ==============================
// KEAMANAN TAMPILAN
// ==============================

function escapeHtml(text) {

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(text) {

    return String(text || "")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==============================
// JALANKAN
// ==============================

loadBerita();

</script>

</body>
</html>
